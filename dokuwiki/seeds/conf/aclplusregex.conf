#aclplusregex.conf
# Defined are the dynamic permissions


##----------------- PUBLIC ACCESS NAMESPACES ----------------##

#allow only user and guest read access everywhere
**   @(user|guest)$    1

# Allow user to read all info/ media 
public:*               @ALL     1
wiki:*                 @ALL     1
(\w+):public:**        @ALL     1

#Allow all access to public/avatar namespace
user:(\w+):public:**   @ALL              1
user:(\w+):share:**    @(user|guest)$    1

##-------------------- END PUBLIC ACCESS ----------------------##


##-------------------- USER BASED PERMISSIONS ------------------##
# allow users to mess around in the public playground, but not a guest user
playground:**	   @user	16
playground:**      @ALL     0

##--------------------END USER BASED PERMISSIONS -----------------##


##-------------------- PRIVATE USER NAMESPACES -------------------##
# revoke all user and guest permissions
user:**              @ALL   0

# Guests cannot access private user namespaces, even if also in @user.
# Keep existing public/share access read-only. \x3a is a colon, so the
# pattern matches exactly one username component.
user:([^\x3a]+)                @guest     0
user:([^\x3a]+):**             @guest     0
user:([^\x3a]+):public:**      @guest     1
user:([^\x3a]+):share:**       @guest     1

# Grant each non-guest user their own namespace
# Keep the quoted regex: a literal user:$1:** would outrank the guest denial.
user:*                         ^([\w.-]+)$    1
user:(\Q$1\E):**              ^([\w.-]+)$    16

##--------------------END PRIVATE USER NAMESPACE -----------------##


##-------------------- GROUP BASED NAMESPACES -----------------##

# Allow members of 'group' to access all pages in the 'group' namespace.
# BE CAREFUL to ensure that all group names and namespaces are unique.
#
# First, lets block everyone to the private namespaces
(\w+):private:**        @ALL       0

# Give anyone with group name the same as namespace delete permissions everywhere except private
# The groups ALL and user are ignored

$1:**             @(?!ALL$|user$|guest$)([a-zA-Z0-9.-]+)(?:_staff|_admin|)$      16
$1:private:**     @(?!ALL$|user$|guest$)([a-zA-Z0-9.-]+)$                        0
$1:private:**     @(?!ALL$|user$|guest$)([a-zA-Z0-9.-]+)_staff$                  1


##-------------------- END GROUP BASED NAMESPACES -----------------##
