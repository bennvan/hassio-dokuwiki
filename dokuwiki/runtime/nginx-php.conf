try_files $uri =404;
include /etc/nginx/dokuwiki-fastcgi.conf;
fastcgi_param HTTP_HOST $host$wiki_port_suffix;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
# Preserve Bearer/Basic credentials for DokuWiki's remote API and MCP endpoint.
fastcgi_param HTTP_AUTHORIZATION $http_authorization;
fastcgi_pass 127.0.0.1:9000;
fastcgi_read_timeout 120s;
# Coalesce template flushes while PHP renders the page/preview content.
fastcgi_buffering on;
fastcgi_buffer_size 16k;
fastcgi_buffers 8 32k;
