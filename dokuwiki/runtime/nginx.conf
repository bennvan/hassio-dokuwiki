user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Retain externally mapped ports without forwarding an unvalidated hostname.
    map $http_host $wiki_port_suffix {
        default "";
        ~:(?<wiki_request_port>[0-9]+)$ :$wiki_request_port;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 40m;
    server {
        listen 8080;
        root /var/www/html;
        index doku.php;
        # This is an origin server, not a forward proxy. Disallow ambiguous
        # absolute-form request targets before using the Host header's port.
        if ($request ~* "^[A-Z]+[ ]+https?://") { return 400; }

        absolute_redirect off;
        location = /healthz {
            access_log off;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/dokuwiki-runtime/health.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location = / {
            if (!-f /share/dokuwiki/conf/local.php) { return 302 /install.php; }
            rewrite ^ /doku.php last;
        }
        # DokuWiki checks ACLs before emitting X-Accel-Redirect. These locations
        # must NEVER be accessible directly, including uploaded PHP files.
        location ^~ /data/media/ { internal; alias /share/dokuwiki/data/media/; }
        location ^~ /data/media_attic/ { internal; alias /share/dokuwiki/data/media_attic/; }
        location ^~ /data/cache/ { internal; alias /share/dokuwiki/data/cache/; }
        location ^~ /data/ { return 404; }
        location ^~ /conf/ { return 404; }
        location ^~ /inc/ { return 404; }
        location ^~ /bin/ { return 404; }
        location ^~ /vendor/ { return 404; }
        location ^~ /_x_accel_redirect/ { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~* /(README(?:\.md)?|COPYING|VERSION|AGENTS\.md|install\.conf|composer\.(json|lock))$ { return 404; }

        location /_media/ { rewrite ^/_media/(.*)$ /lib/exe/fetch.php?media=$1 last; }
        location /_detail/ { rewrite ^/_detail/(.*)$ /lib/exe/detail.php?media=$1 last; }
        location /_export/ { rewrite ^/_export/([^/]+)/(.*)$ /doku.php?do=export_$1&id=$2 last; }
        location / { try_files $uri $uri/ @wiki; }
        location @wiki { rewrite ^/(.*)$ /doku.php?id=$1 last; }

        location = /install.php {
            if (-f /share/dokuwiki/conf/local.php) { return 404; }
            include /etc/nginx/dokuwiki-php.conf;
        }
        location ~ \.php$ { include /etc/nginx/dokuwiki-php.conf; }
    }
}
